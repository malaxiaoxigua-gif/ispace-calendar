name: Sync iSpace Calendar

on:
  schedule:
    # 每 3 小时自动同步一次
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支持手动点击随时刷新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run calendar sync
        env:
          ISPACE_CALENDAR_URL: ${{ secrets.ISPACE_CALENDAR_URL }}
        run: |
          python sync_calendar.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
